<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solo Leveling DLE</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js"></script>
</head>
<body>
  <h1>Solo Leveling - The game</h1>
  <input type="text" id="guessInput" placeholder="Guess the character..." oninput="showSuggestions()" autocomplete="off">
  <div id="suggestions"></div>
  <button onclick="submitGuess()">Try</button>
  <div id="guesses"></div>
  <h1>Solo Leveling - Characters</h1>
  <div class="grid" id="characterGrid"></div>
</body>
</html>
